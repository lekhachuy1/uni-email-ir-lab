# DNS nội bộ cho lab (chạy trên router/OPNsense hoặc một VM: dnsmasq).
# Khởi động thử: dnsmasq -C dnsmasq.conf -d
# Chỉ phục vụ lab, không forward ra Internet (chặn rò rỉ):
no-resolv
no-hosts
domain-needed
bogus-priv

# --- Bản ghi A ---
address=/sso.uni.lab/10.10.20.11
address=/mail.uni.lab/10.10.20.10
address=/siem.uni.lab/10.10.20.12
address=/ca.uni.lab/10.10.20.5
address=/autodiscover.uni.lab/10.10.20.10
address=/autoconfig.uni.lab/10.10.20.10
# domain sinh viên dùng chung mail server
address=/mail.st.uni.lab/10.10.20.10
# "bên ngoài"
address=/login.uni-lab.support/203.0.113.66
address=/mail.uni-lab.support/203.0.113.66
address=/mail.evil.lab/203.0.113.66
address=/ext-mail.external.lab/203.0.113.30

# --- MX ---
mx-host=uni.lab,mail.uni.lab,10
mx-host=st.uni.lab,mail.uni.lab,10
mx-host=uni-lab.support,mail.uni-lab.support,10
mx-host=evil.lab,mail.evil.lab,10
mx-host=external.lab,ext-mail.external.lab,10

# --- TXT: SPF / DMARC ---
# uni.lab: chỉ cho mail.uni.lab gửi
txt-record=uni.lab,"v=spf1 ip4:10.10.20.10 -all"
txt-record=_dmarc.uni.lab,"v=DMARC1; p=quarantine; rua=mailto:dmarc@uni.lab"
# uni-lab.support (domain giả của attacker): để SPF PASS từ IP attacker (attacker thật cũng làm SPF pass)
txt-record=uni-lab.support,"v=spf1 ip4:203.0.113.66 -all"
# KHÔNG tạo DMARC alignment với uni.lab cho domain giả -> Rspamd sẽ gắn cờ thư ngoài / mạo danh.
#
# DKIM: sau khi tạo domain trong mailcow, lấy khoá public ở UI (Configuration > Domains > DKIM) và thêm:
#   txt-record=dkim._domainkey.uni.lab,"v=DKIM1; k=rsa; p=<PUBLIC_KEY>"
# (tên selector mặc định của mailcow là "dkim")
