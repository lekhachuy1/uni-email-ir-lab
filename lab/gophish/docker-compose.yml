# GoPhish v0.12.1 cho diễn tập D1 (phishing). Chạy trên VM attacker (NET-INET-A), KHÔNG mở ra Internet.
# Image mặc định đã bind admin 0.0.0.0:3333 (https, cert tự ký) — truy cập qua https://<attacker-ip>:3333
# QUAN TRỌNG: image KHÔNG có volume sẵn -> phải mount, nếu không mất toàn bộ bằng chứng chiến dịch khi xoá container.
services:
  gophish:
    image: gophish/gophish:v0.12.1
    container_name: gophish
    restart: unless-stopped
    environment:
      TZ: UTC                                   # Launch Date nhập giờ local-trình-duyệt rồi đổi sang UTC
      DB_FILE_PATH: /opt/gophish/data/gophish.db
      # Phish server chạy TLS với cert do CA lab cấp cho login.uni-lab.support (attacker thật cũng có cert hợp lệ)
      PHISH_LISTEN_URL: 0.0.0.0:443
      PHISH_USE_TLS: "true"
      PHISH_CERT_PATH: /opt/gophish/ssl/tls.crt
      PHISH_KEY_PATH: /opt/gophish/ssl/tls.key
      CONTACT_ADDRESS: redteam@lab.local
    volumes:
      - gophish-data:/opt/gophish/data           # DB: campaign, results -> export ra Evidence/ kèm SHA-256
      - ../certs/login.uni-lab.support:/opt/gophish/ssl:ro
    ports:
      - "3333:3333"                              # Admin UI (https, tự ký). Lấy mật khẩu lần đầu: docker logs gophish
      - "80:80"                                  # phish http (redirect)
      - "443:443"                                # phish https
    networks: [labinet]

volumes:
  gophish-data:

networks:
  labinet:
    external: true
