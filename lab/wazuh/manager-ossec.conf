<!-- Thêm vào /var/ossec/etc/ossec.conf của Wazuh MANAGER trên siem.uni.lab (bên trong <ossec_config>). -->

<!-- 1) Đọc log mailcow do rsyslog gom về (xem mailcow-rsyslog.conf) -->
<localfile>
  <log_format>syslog</log_format>
  <location>/var/log/mailcow.log</location>
</localfile>

<!-- 2) Nhận syslog trực tiếp từ router/firewall OPNsense/pfSense. allowed-ips LÀ BẮT BUỘC. -->
<remote>
  <connection>syslog</connection>
  <port>514</port>
  <protocol>udp</protocol>
  <allowed-ips>10.10.20.0/24</allowed-ips>
  <local_ip>10.10.20.12</local_ip>
</remote>

<!-- 3) Khai báo CDB list campus-ips cho rule 100250/100242 (tạo file /var/ossec/etc/lists/campus-ips,
        nội dung xem skill wazuh-email-detection), rồi biên dịch: /var/ossec/bin/wazuh-logtest tự nạp;
        với alert thật cần: /var/ossec/bin/wazuh-control restart -->
<ruleset>
  <list>etc/lists/campus-ips</list>
</ruleset>

<!-- Decoder: chép wazuh-email-detection/assets/keycloak_decoders.xml -> /var/ossec/etc/decoders/
     Rule:    chép wazuh-email-detection/assets/uni_email_rules.xml -> /var/ossec/etc/rules/
     chown wazuh:wazuh, chmod 660, rồi restart manager. -->
