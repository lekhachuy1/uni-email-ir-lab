<!-- Thêm vào ossec.conf của Wazuh AGENT chạy trên sso.uni.lab (bên trong <ossec_config>).
     Đọc file log plain-text mà container Keycloak ghi ra (bind-mount ./kc-log của stack keycloak).
     Sửa <location> cho đúng đường dẫn tuyệt đối trên VM sso, ví dụ /opt/lab/keycloak/kc-log/keycloak.log -->
<localfile>
  <log_format>syslog</log_format>
  <location>/opt/lab/keycloak/kc-log/keycloak.log</location>
</localfile>

<!-- Sau khi thêm, trên agent: systemctl restart wazuh-agent
     Kiểm tra trên MANAGER bằng wazuh-logtest -v (dán 1 dòng [org.keycloak.events] thật):
       - phase 2 phải thấy kc_type, srcip, kc_username
       - phase 3 phải ra rule 100201/100210/...  (decoder+rule nạp từ wazuh-email-detection/assets) -->
