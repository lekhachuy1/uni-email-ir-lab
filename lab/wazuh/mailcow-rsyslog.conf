# /etc/rsyslog.d/10-mailcow.conf trên siem.uni.lab (10.10.20.12) - nhận log mailcow qua UDP/514.
# Bật module UDP (nếu chưa): trong /etc/rsyslog.conf bỏ comment:
#   module(load="imudp")
#   input(type="imudp" port="514")
# rồi: systemctl restart rsyslog

# Ghi mọi thứ vào facility local3 ra 1 file để Wazuh đọc.
local3.*    /var/log/mailcow.log
& stop

# GỢI Ý nếu decoder postfix/dovecot built-in không khớp do "double syslog header"
# (xem skill wazuh-email-detection): dùng template chỉ giữ phần message bên trong, ví dụ
#   template(name="inneronly" type="string" string="%msg%\n")
#   local3.*  /var/log/mailcow.log;inneronly
# Kiểm tra 1 dòng thật bằng wazuh-logtest trước khi chốt.
